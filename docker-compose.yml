services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mongo:
    image: mongo:7

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  producer:
    build:
      context: ./Producer
      dockerfile: Dockerfile

    depends_on:
      - kafka

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: raw-survey-topic

    volumes:
      - ./data:/app/data:ro

  processor:
    build:
      context: ./ProcessingService
      dockerfile: Dockerfile

    depends_on:
      - kafka

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RAW_TOPIC: raw-survey-topic
      PROCESSED_TOPIC: processed-survey-topic

  consumer:
    build:
      context: ./Consumer
      dockerfile: Dockerfile

    restart: on-failure

    depends_on:
      - kafka
      - mongo
      - processor

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: processed-survey-topic
      KAFKA_GROUP_ID: csharp-consumer

      MONGO_CONNECTION_STRING: mongodb://mongo:27017
      MONGO_DATABASE: DeveloperLearningDb
      MONGO_COLLECTION: Developers

  api:
    build:
      context: ./Api
      dockerfile: Dockerfile

    depends_on:
      - mongo

    environment:
      MONGO_CONNECTION_STRING: mongodb://mongo:27017
      MONGO_DATABASE: DeveloperLearningDb
      MONGO_COLLECTION: Developers

    ports:
      - "8080:8080"

volumes:
  mongo_data: